name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: vet the emu for the other host OS
        run: GOOS=${{ runner.os == 'macOS' && 'linux' || 'darwin' }} GOARCH=arm64 go vet ./cmd/emu/...
      - name: Xvfb for the emu window test
        if: runner.os == 'Linux'
        run: command -v Xvfb || { sudo apt-get update -q && sudo apt-get install -y -q xvfb; }
      - name: vet guests for wasip1
        run: GOOS=wasip1 GOARCH=wasm go vet ./sdk/... ./appl/...
      - name: portable packages build without a host OS
        run: GOOS=wasip1 GOARCH=wasm go build ./abi ./styx ./platform ./core ./vm ./memdraw/... ./libsec ./pgauth/...
      - name: build guests
        run: go run ./tools/build
      - name: unit tests with the race detector
        run: go test -race $(go list ./... | grep -v /cmd/emu)
      - name: the emu window's key, button and pixel mappings
        run: go test -race -run 'X11|Mac|Convert|Frame' ./cmd/emu/host
      # The emu acceptance tests run many wazero-compiled guests; under the
      # race detector they exceed the runners' memory.
      # Each runner takes one wazero mode, so both are covered while a
      # runner does half the work: the interpreter on x86_64, the compiler
      # (native arm64 code) on the arm64 runners.
      - name: emu acceptance tests
        run: go test -timeout 30m ./cmd/emu
        env:
          PURG_EMU_MODES: ${{ matrix.os == 'ubuntu-24.04' && 'interpreter' || 'compiler' }}
      - name: self-hosting (Go's compiler and linker as guests)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: go run ./tools/gotools && go test -count=1 -run TestSelfHost ./cmd/emu
        env:
          PURG_EMU_MODES: compiler
      - name: fuzz smoke
        if: matrix.os == 'ubuntu-24.04'
        run: go test -run '^$' -fuzz FuzzUnmarshal -fuzztime 30s ./styx
      - name: guest hashes
        run: |
          find root/bin -path root/bin/go -prune -o -name '*.wasm' -print | sort | xargs shasum -a 256 > guest-hashes.txt
          cat guest-hashes.txt
      - uses: actions/upload-artifact@v5
        with:
          name: guest-hashes-${{ matrix.os }}
          path: guest-hashes.txt
      # wazero compiles for the host only, so the kernel's images
      # (tools/aot) are made on the arm64 runners, which must agree.
      - name: AOT image hashes
        if: runner.arch == 'ARM64'
        run: go run ./tools/aot -sums aot-hashes.txt && cat aot-hashes.txt
      - uses: actions/upload-artifact@v5
        if: runner.arch == 'ARM64'
        with:
          name: aot-hashes-${{ matrix.os }}
          path: aot-hashes.txt

  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: TamaGo toolchain and QEMU
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
          v=$(sed -n 's/.*usbarmory\/tamago v\(.*\)/\1/p' kernel/go.mod)
          git clone -q --depth 1 --branch tamago-go$v https://github.com/usbarmory/tamago-go $RUNNER_TEMP/tamago-go
          (cd $RUNNER_TEMP/tamago-go/src && GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash)
          echo "TAMAGO=$RUNNER_TEMP/tamago-go/bin/go" >> $GITHUB_ENV
      - name: build the guests
        run: go run ./tools/build
      - name: the sh corpus on the kernel under QEMU
        run: timeout 1200 go run ./tools/kernel -corpus
      - name: networking on the kernel under QEMU
        run: timeout 600 go run ./tools/kernel -net
      - name: the disk on the kernel under QEMU
        run: timeout 600 go run ./tools/kernel -disk-check
      - name: SMP stress on the kernel under QEMU
        run: timeout 1500 go run ./tools/kernel -smp 4 -stress 240

  kernel-aot:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: TamaGo toolchain and QEMU
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q qemu-system-arm
          v=$(sed -n 's/.*usbarmory\/tamago v\(.*\)/\1/p' kernel/go.mod)
          git clone -q --depth 1 --branch tamago-go$v https://github.com/usbarmory/tamago-go $RUNNER_TEMP/tamago-go
          (cd $RUNNER_TEMP/tamago-go/src && GOROOT_BOOTSTRAP=$(go env GOROOT) ./make.bash)
          echo "TAMAGO=$RUNNER_TEMP/tamago-go/bin/go" >> $GITHUB_ENV
      - name: build the guests
        run: go run ./tools/build
      - name: the sh corpus on the kernel with AOT images
        run: timeout 1200 go run ./tools/kernel -aot -corpus
      - name: the aot engine's choice of images
        run: timeout 600 go run ./tools/kernel -aot-check
      - name: the sh corpus on the kernel's compiler, on 4 CPUs
        run: timeout 1200 go run ./tools/kernel -engine compiler -smp 4 -corpus
      - name: SMP stress on the kernel with AOT images
        run: timeout 1500 go run ./tools/kernel -aot -smp 4 -stress 240

  reproducible:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: guest-hashes-*
      - name: guests are byte-identical on every runner
        run: |
          set -e
          first=""
          for f in guest-hashes-*/guest-hashes.txt; do
            echo "$f"; cat "$f"
            if [ -z "$first" ]; then first=$f; else diff -u "$first" "$f"; fi
          done
      - uses: actions/download-artifact@v5
        with:
          pattern: aot-hashes-*
      - name: AOT images are byte-identical on every arm64 runner
        run: |
          set -e
          first=""
          for f in aot-hashes-*/aot-hashes.txt; do
            echo "$f"; cat "$f"
            if [ -z "$first" ]; then first=$f; else diff -u "$first" "$f"; fi
          done
          [ -n "$first" ]
